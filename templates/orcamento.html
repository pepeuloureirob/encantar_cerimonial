{% extends "base.html" %}{% block title %}Orçamento · {{ site.nome }}{% endblock %}{% block content %}
<section class="page-hero"><div class="container"><div class="eyebrow">Seu evento começa aqui</div><h1>Solicite um orçamento</h1><p>Preencha os dados e continuaremos a conversa pelo WhatsApp.</p></div></section>
<section class="section"><div class="container" style="max-width:850px"><form class="form" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><div class="grid grid-2"><div><label>Nome</label><input name="nome" required></div><div><label>Telefone</label><input name="telefone" required></div><div><label>Tipo de evento</label><input name="tipo" placeholder="Casamento, aniversário, formatura..."></div><div><label>Data</label><input type="date" name="data"></div><div><label>Número de convidados</label><input name="convidados"></div></div><label>Observações</label><textarea name="mensagem"></textarea><button class="btn primary">Continuar pelo WhatsApp</button></form></div></section>
{% endblock %}
