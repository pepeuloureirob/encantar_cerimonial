{% extends "admin/base.html" %}

{% block content %}

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px">

    <a class="btn" href="{{ url_for('admin_dashboard') }}">
        Dashboard
    </a>

    <a class="btn" href="{{ url_for('admin_eventos') }}">
        Eventos
    </a>

    <a class="btn" href="{{ url_for('admin_imagens') }}">
        Imagens
    </a>

    <a class="btn" href="{{ url_for('admin_servicos') }}">
        Serviços
    </a>

    <a class="btn" href="{{ url_for('admin_equipe') }}">
        Equipe
    </a>

    <a class="btn" href="{{ url_for('admin_configuracoes') }}">
        Configurações
    </a>

    <a class="btn" href="{{ url_for('admin_backup') }}">
        Backup
    </a>

</div>


<div class="card">

    <div class="eyebrow">
        Identidade e contatos
    </div>

    <h1 style="font-size:55px">
        Configurações
    </h1>


    <form
        method="post"
        enctype="multipart/form-data"
    >

        <input
            type="hidden"
            name="_csrf"
            value="{{ csrf_token }}"
        >


        <div class="grid grid-2">


            <!-- COLUNA ESQUERDA -->

            <div>

                <label>
                    Nome da empresa
                </label>

                <input
                    name="nome_empresa"
                    value="{{ values.nome_empresa }}"
                >


                <label>
                    Slogan
                </label>

                <input
                    name="slogan"
                    value="{{ values.slogan }}"
                >


                <label>
                    Descrição
                </label>

                <textarea name="descricao">{{ values.descricao }}</textarea>


                <!-- LOGO -->

                <label>
                    Logo da empresa
                </label>


                {% if values.logo %}

                    <div style="margin:15px 0;">

                        <p style="margin-bottom:8px;">
                            Logo atual:
                        </p>

                        <img
                            src="{{ url_for(
                                'static',
                                filename='uploads/' ~ values.logo
                            ) }}"
                            alt="Logo atual"
                            style="
                                max-width:220px;
                                max-height:100px;
                                object-fit:contain;
                                border:1px solid #ddd;
                                padding:12px;
                                border-radius:10px;
                                background:#fff;
                            "
                        >

                    </div>

                {% endif %}


                <label>
                    Escolher nova logo
                </label>

                <input
                    type="file"
                    name="logo_file"
                    accept=".png,.jpg,.jpeg,.webp,.gif"
                >

                <small>
                    Formatos permitidos:
                    PNG, JPG, JPEG, WEBP ou GIF.
                </small>

            </div>


            <!-- COLUNA DIREITA -->

            <div>

                <label>
                    WhatsApp
                </label>

                <input
                    name="whatsapp"
                    value="{{ values.whatsapp }}"
                    placeholder="5583999999999"
                >


                <label>
                    Instagram
                </label>

                <input
                    name="instagram"
                    value="{{ values.instagram }}"
                >


                <label>
                    Facebook
                </label>

                <input
                    name="facebook"
                    value="{{ values.facebook }}"
                >


                <label>
                    E-mail
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ values.email }}"
                >


                <label>
                    Telefone
                </label>

                <input
                    name="telefone"
                    value="{{ values.telefone }}"
                >


                <label>
                    Endereço
                </label>

                <input
                    name="endereco"
                    value="{{ values.endereco }}"
                >


                <label>
                    Google Maps / iframe
                </label>

                <input
                    name="maps"
                    value="{{ values.maps }}"
                >

            </div>

        </div>


        <button
            class="btn primary"
            type="submit"
        >
            Salvar configurações
        </button>

    </form>

</div>

{% endblock %}
