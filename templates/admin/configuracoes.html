{% extends "admin/base.html" %}{% block content %}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px">
<a class="btn" href="{{ url_for('admin_dashboard') }}">Dashboard</a><a class="btn" href="{{ url_for('admin_eventos') }}">Eventos</a><a class="btn" href="{{ url_for('admin_imagens') }}">Imagens</a><a class="btn" href="{{ url_for('admin_servicos') }}">Serviços</a><a class="btn" href="{{ url_for('admin_equipe') }}">Equipe</a><a class="btn" href="{{ url_for('admin_configuracoes') }}">Configurações</a><a class="btn" href="{{ url_for('admin_backup') }}">Backup</a>
</div>
<div class="card"><div class="eyebrow">Identidade e contatos</div><h1 style="font-size:55px">Configurações</h1><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><div class="grid grid-2"><div><label>Nome da empresa</label><input name="nome_empresa" value="{{ values.nome_empresa }}"><label>Slogan</label><input name="slogan" value="{{ values.slogan }}"><label>Descrição</label><textarea name="descricao">{{ values.descricao }}</textarea><label>Logo (nome do arquivo enviado)</label><input name="logo" value="{{ values.logo }}"></div><div><label>WhatsApp</label><input name="whatsapp" value="{{ values.whatsapp }}" placeholder="5583999999999"><label>Instagram</label><input name="instagram" value="{{ values.instagram }}"><label>Facebook</label><input name="facebook" value="{{ values.facebook }}"><label>E-mail</label><input type="email" name="email" value="{{ values.email }}"><label>Telefone</label><input name="telefone" value="{{ values.telefone }}"><label>Endereço</label><input name="endereco" value="{{ values.endereco }}"><label>Google Maps / iframe</label><input name="maps" value="{{ values.maps }}"></div></div><button class="btn primary">Salvar configurações</button></form></div>{% endblock %}
